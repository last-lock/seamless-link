syntax = "proto3";

// Key provisioning messages used for device credential keys.
package lastlock.api.keys;

// Keys for the MIFARE Classic NFC Credential
message MifareClassicKeys
{
  // Read Key
  optional bytes A_key = 1
      [ debug_redact = true ];
  // Write Key
  optional bytes B_key = 2
      [ debug_redact = true ];
}

// Which of a MIFARE Classic sector's two keys to authenticate a read with.
// Not a choice of PSA key slot: Key A and Key B live together in one
// combined 12-byte keystore entry (see shadowstate.proto's
// DeviceKeyType.DEVICE_KEY_TYPE_MIFARE_CLASSIC), and this only selects which
// half of that one resolved key firmware's phalMfc_Authenticate call uses.
enum MifareClassicKeyType
{
  MIFARE_CLASSIC_KEY_TYPE_UNSPECIFIED = 0;
  MIFARE_CLASSIC_KEY_TYPE_A = 1;
  MIFARE_CLASSIC_KEY_TYPE_B = 2;
}
// Keys for an Apple Wallet credential.
message AppleWallet
{
  // Privacy key for transaction
  bytes privacy_key = 1 [ debug_redact = true ];
  // Security/master key to access secure credential information
  bytes credential_key = 2
      [ debug_redact = true ];
}
// Keys for a Google Wallet credential.
message GoogleWallet
{
  // Master key for transaction
  bytes master_key = 1 [ debug_redact = true ];
  // DF-Name from transaction
  bytes dfname = 2;
}
// One key in a device's key table.
message ProfileKey
{
  // Device-scoped identifier, referenced by lastlock.api.KeyCandidate.key_id.
  // Ids are unique across the whole table, not per profile, so several
  // profiles may reference the same entry - a site key shared by two sites is
  // delivered once and occupies one keystore slot.
  //
  // Assign densely from 0; ids must be less than the table's capacity, since
  // anything larger is a dangling reference.
  optional uint32 key_id = 1;

  // Raw key material. Length must match the KeyAlgorithm the referencing
  // profile declares: 8 bytes for DES, 16 for AES-128 and 2K3DES, 24 for
  // AES-192 and 3K3DES, 32 for AES-256. Must be present - a table entry
  // carrying no key material is rejected rather than treated as an all-zero
  // key.
  //
  // A key used both to diversify and to authenticate needs two entries, since
  // the algorithm a key is imported under is fixed for the life of the key.
  optional bytes key = 2 [ debug_redact = true ];
}

// Every key a device needs, addressed by key_id rather than by role or by
// owning profile.
//
// This is the authoring shape. Each ProfileKey is individually encrypted
// under a key-encryption key wrapped for the target device
// (Configurations.encrypted_keys_kek) and delivered as one element of
// Configurations.encrypted_keys, so the device decrypts and imports keys one
// at a time and never holds more than a single key in the clear.
//
// Reader-side keystore placement is deliberately absent. The device assigns
// storage when it imports a key and is the only party that can, since key
// material reaches it encrypted. Because the table is flat and dense, that
// assignment is a pure function of key_id and does not shift when a profile is
// edited.
message KeyTable
{
  repeated ProfileKey keys = 1;
}

// Keys for a generic DESFire credential profile (LEAF, AN10922 PACS, etc.)
//
// Deprecated in favor of KeyTable: keys are a device-level resource, not a
// per-profile one. Retained so profiles authored against the two-role shape
// keep working unchanged.
message GenericDesfire
{
  // Primary credential authentication key (AES-128, 16 bytes).
  bytes credential_key = 1
      [ debug_redact = true ];
  // Optional privacy authentication key (AES-128, 16 bytes).
  // Only needed when the credential profile uses a two-step privacy flow.
  optional bytes privacy_key = 2
      [ debug_redact = true ];
}

// Collection of the different wallet key types
message WalletKeys
{
  reserved 1, 2, 3;
  oneof WalletType
  {
    // Apple Wallet keys.
    AppleWallet apple_wallet = 4;
    // Google Wallet keys.
    GoogleWallet google_wallet = 5;
    // Generic DESFire profile keys (LEAF, AN10922 PACS, etc.)
    GenericDesfire generic_desfire = 6;
  }
}
// Sets the device private key per the PKOC specification

message PKOCKeys
{
  // Private key used for PKOC device provisioning.
  bytes private_key = 1 [ debug_redact = true ];
}

// Exclusive operation to put credential keys on the device
// Only one set of keys can be provisioned at any one time
message KeyProvisionRequest
{
  oneof KeyType
  {
    // MIFARE Classic A and B Keys
    MifareClassicKeys mfc_keys = 2;
    // Message defining the different types of Wallet Keys
    WalletKeys wallet_keys = 3;
    // Defines the PKOC private key
    PKOCKeys pkoc_keys = 4;
  }
}
