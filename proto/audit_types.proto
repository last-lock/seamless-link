syntax = "proto3";

package lastlock.api.audittypes;

enum AuditType
{
  // Reserved for the unknown value
  UNKNOWN_AUDITTYPE = 0x00;

  // Credential authenticated, lock moved to locked position.
  Lock = 0x01;

  // Credential authenticated, lock moved to unlocked position.
  Unlock = 0x02;

  // Unlock followed by auto re-lock.
  LockCycle = 0x03;

  // Valid credential, access not allowed (any time).
  UnauthorizedUser = 0x04;

  // Credential could not be parsed.
  InvalidCredential = 0x05;

  // Authorized user, not allowed at current time.
  OutOfSchedule = 0x06;

  // Lock moved to locked position at scheduled time.
  ScheduledLock = 0x07;

  // Lock moved to unlocked position at scheduled time.
  ScheduledUnlock = 0x08;

  // Lock manually locked (thumbturn or shackle close).
  ManualLock = 0x09;

  // Lock manually unlocked (thumbturn).
  ManualUnlock = 0x0A;
  // An unspecified error occurred.
  UnspecifiedError = 0x0B;
  // The device is low battery
  LowBattery = 0x0C;
  // A brownout was detected
  Brownout = 0x0D;
  // Data at this PSC was lost or corrupted.
  DataLoss = 0x0E;
  // The battery is in a critical state
  CriticalBattery = 0x0F;
  // Battery is Dead
  DeadBattery = 0x10;

  // Initial Aliro reader public key was captured during provisioning.
  AliroReaderPublicKeyCaptured = 0x11;

  // Aliro UD public key credential audit.
  AliroUdPublicKey = 0x12;

  // Device lifecycle/readiness event.
  DeviceLifecycle = 0x13;

  // OOB command accepted by firmware.
  Command = 0x14;

  // Device entered cooldown mode.
  Cooldown = 0x15;

  // [Deprecated] Eclipse permanently disabled itself.
  EclipsePermDisabled = 0x16;

  // Eclipse is temporarily disabled on the device. The device does this itself.
  // This is transient and will be cleared on next boot or via OOB or when condition becomes false.
  // Examples: loop detected, device in critical mode, sensor data being collected, etc...
  EclipseDisableDevice = 0x17;

  // Eclipse is no longer temporarily disabled on the device. The device can do this itself.
  // Examples: device exits critical mode, device done w/ sensor data, OOB instructs to clear.
  // Note: This audit will be omitted if device reenables via a reboot.
  //       Use the boot info (or lack of) to determine if Eclipse is still temporarily disabled.
  EclipseReenableDevice = 0x18;

  // A hardware module errored twice and was set in the error bitmap.
  // Notifies the Server that a hardware module was in an errored state and
  // is disabled until intentionally cleared.
  HardwareError = 0x19;

  // Backend LiSa battery analysis event.
  LiSaAnalysis = 0x1A;

  // The device's battery was replaced. Sent once the device takes a
  // battery_replaced out-of-band operation; when_device is the replacement
  // time it carried. Resets the server's battery estimate for the device.
  BatteryReplaced = 0x1B;
}
