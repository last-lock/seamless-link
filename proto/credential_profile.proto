syntax = "proto3";

// DESFire profile metadata for credentials known to Link and firmware.
package lastlock.api;

import public "credential_profile_configurations.proto";


//
// OVERVIEW
//
// A credential profile is what a device needs in order to read one population
// of DESFire cards. DESFire has no fixed on-card layout - the credential can
// live in any application, in any file, behind any key - so a device cannot
// read a card without being told where to look and how to get there.
//
// A profile names the applications to visit, in order. For each one it gives
// the application's identity, the key that authenticates to it and how that
// key is derived per card, and what to read once inside. The bytes read are
// then sliced into the credential identifier the device matches against its
// enrolled credentials, and the transaction is closed.
//
// Keys are not carried inside profiles. They belong to the device, arrive
// encrypted, and profiles reference them by identifier - so two profiles that
// share a key point at the same entry and it is delivered once.
//
// A device holds up to five profiles and tries each in turn on a tap, which is
// how one device reads physical cards and mobile wallet credentials alike.
// Each profile is stated one of two ways: the original field-driven
// configuration, or the declarative form that the rest of this file describes.
//
// Profile and keys for a credential type.
message DesfireProfile
{
  reserved 1 to 19, 23;

  // Encrypted credential authentication key material, carried on the
  // profile that uses it. Read only by devices that take their profiles from
  // a Configurations message; a device that takes them from shadow state
  // holds its keys as device keys and profiles reference those by UID.
  optional bytes encrypted_credential_key = 20;

  // Optional privacy authentication key for the same profile, on the same
  // terms.
  optional bytes encrypted_privacy_key = 21;

  // Deprecated: use legacy_desfire_profile. Kept so configurations authored
  // against earlier releases still parse, and ignored by the device, which
  // reads the transaction oneof below instead.
  DesfireProfileConfigurations configurations = 22;

  // How to run the transaction on the card. Set exactly one of the two fields
  // below: the legacy field-driven configuration, or the declarative profile.
  // A profile described both ways at once has no correct reading, so the two
  // are mutually exclusive rather than independently settable.
  oneof transaction
  {
    // Declarative DESFire transaction definition.
    CredentialProfile desfire_credential_profile = 24;

    // Legacy parameterized configuration: select, authenticate, read, extract,
    // finalize, driven by fixed fields. Replaces the deprecated field 22
    // above, which the device does not read.
    DesfireProfileConfigurations legacy_desfire_profile = 25;
  }
}

// Full profile set to apply to devices.
message DesfireProfileSet
{
  repeated DesfireProfile profiles = 1;
  optional bytes ecp = 2;
}

// Where bytes produced during the transaction live. Operations write
// registers; DataReferences read them.
enum Register
{
  REGISTER_UNSPECIFIED = 0;
  // NFCID1 from ISO 14443 activation (4/7/10 bytes). Fixed-UID cards only;
  // wallet devices and Random-ID cards present a randomized value here.
  ANTICOLLISION_UID = 1;
  // Output of a GetCardUid operation (real UID over an authenticated channel).
  CARD_UID = 2;
  // FCI returned by a select. The device requests the FCI automatically when
  // any DataReference in the profile targets this register.
  SELECT_FCI = 3;
  // 3-byte AID of the application being executed.
  APPLICATION_ID = 4;
  // Output of a ReadFile operation.
  READ_DATA = 5;
}

// A byte slice over a register: the one concept reused for diversification
// inputs, credential extraction, data-dependent application selection, and
// named outputs.
message DataReference
{
  // Which register the bytes are taken from.
  //
  // Named source_register rather than register because the field name becomes
  // a struct member in generated C, where "register" is a reserved storage
  // class specifier and will not compile.
  optional Register source_register = 1;

  // Which occurrence of the register across the whole transaction
  // (0 = first read/select/GetCardUid).
  optional uint32 index = 2;

  // Byte offset within the register.
  optional uint32 offset = 3;

  // Byte length; 0 means to the end of the register.
  optional uint32 length = 4;

  // Optional bit-level refinement of the byte slice.
  BitWindow bit_window = 5;
}

// Normalizes bit-packed payloads - right-justified Wiegand streams and
// similar - into stable bytes for matching. The device extracts a bit range
// and nothing more: parity stripping, per-format field maps and BCD decoding
// happen at enrollment, never on the device.
//
// The extracted bits are packed into the smallest whole number of bytes and
// right-justified, so any unused high bits of the first byte are zero. When
// both reversals are set, bits are reversed first, then the packed bytes.
//
// Example - a 26-bit Wiegand payload right-justified in a fixed 16-byte
// field. The payload occupies the low 26 bits, so the leading
// 16 * 8 - 26 = 102 bits are padding:
//
//   bit_window { bit_offset: 102  bit_length: 26 }
//
// which yields 4 bytes whose top 6 bits are zero.
message BitWindow
{
  // First bit of the window, counted from the most significant bit of the
  // referenced byte slice. 0 starts at the first bit of the slice.
  optional uint32 bit_offset = 1;

  // Number of bits in the window. bit_offset + bit_length MUST NOT exceed the
  // length of the referenced slice.
  optional uint32 bit_length = 2;

  // Reverse the bit order of the window before packing, for issuers that write
  // the stream least significant bit first.
  //
  // Example: an 8-bit window over 0xB2 (1011 0010) yields 0x4D (0100 1101).
  optional bool reverse_bits = 3;

  // Reverse the byte order of the packed result, for payloads stored in the
  // opposite byte order to the enrolled credential.
  //
  // Example: a 32-bit window packing to 0A 0B 0C 0D yields 0D 0C 0B 0A.
  optional bool reverse_bytes = 4;
}

// Cipher, key size and the operation the key is used for, stated as one
// value. Determines the key length, which Authentication.Command can be used
// with it, and - for DIV_CMAC - the AN10922 diversification constant, which is
// derived from this value and never configured.
//
// The operation is part of the value rather than a separate field because the
// device pins exactly one algorithm to a key when it imports it into the
// secure key store, and the store enforces that choice for the life of the
// key. The same material used both to diversify and to authenticate is two
// stored keys, and so two table entries.
//
// CMAC entries key an AN10922 diversification; CBC entries authenticate to the
// card and encipher its traffic. There are no GCM entries: DESFire does not
// use authenticated encryption for card communication, so a GCM value would be
// selectable and never performable.
//
// DEVICE SUPPORT. Only AES128_CMAC and AES128_CBC are executable today, and a
// profile selecting any other value is rejected when it is authored rather
// than failing at a card. The remaining values name key types that exist on
// cards in the field and are on the roadmap; each becomes selectable when its
// device support ships.
//
// One consequence worth stating, since it is easy to misread: support for a
// card generation follows the key type that generation was personalized with,
// not the generation itself. A DESFire EV1 card carrying AES-128 keys is
// readable today; the same card carrying Triple DES keys is not.
enum KeyAlgorithm
{
  KEY_ALGORITHM_UNSPECIFIED = 0;

  // AES-128, 16 bytes. AN10922 section 2.2: div constant 0x01, M <= 31 bytes,
  // CMAC input padded to 32 bytes. SUPPORTED.
  AES128_CMAC = 1;
  // AES-128 authentication and enciphered traffic. SUPPORTED.
  AES128_CBC = 2;

  // AES-192, 24 bytes. AN10922 section 2.3: div constants 0x11 and 0x12, two
  // CMACs combined by an overlapping XOR. Not a DESFire card key type, so it
  // is reachable only where the key table serves another credential
  // technology. Targeted for 1.14.2.
  AES192_CMAC = 3;
  AES192_CBC = 4;

  // AES-256, 32 bytes. AN10922 section 2.4, revision 2.2 onward: div constants
  // 0x41 and 0x42. A DESFire card key type only on MIFARE DUOX. Targeted for
  // 1.14.2.
  AES256_CMAC = 5;
  AES256_CBC = 6;

  // 2-key Triple DES, 16 bytes, a.k.a. 2K3DES / 2TDEA. AN10922 section 2.5:
  // div constants 0x21 and 0x22, M <= 15 bytes as each CMAC input is 16 bytes.
  TDEA_2K_CMAC = 7;
  TDEA_2K_CBC = 8;

  // 3-key Triple DES, 24 bytes, a.k.a. 3K3DES / 3TDEA. AN10922 section 2.6:
  // div constants 0x31, 0x32 and 0x33, M <= 15 bytes.
  TDEA_3K_CMAC = 9;
  TDEA_3K_CBC = 10;

  // Single DES, 8 bytes, for legacy EV1-era populations. On the card the key
  // entry is 16 bytes with both halves equal.
  //
  // There is deliberately no DES_CMAC: AN10922 covers only AES-128/192/256,
  // 2TDEA and 3TDEA, and applying the CMAC construction to the 16-byte entry
  // would make the halves diverge, turning it into a genuine 2K3DES key. A
  // diversified DES population uses DIV_ENCR_FULL or DIV_ENCR_HALF instead.
  DES_CBC = 11;
}

// Which reader-side key to authenticate with, and how to derive the per-card
// key from it.
message KeyReference
{
  // Candidate keys for this card key slot, tried in list order - e.g. the
  // current and the next key during a fleet rotation, so cards carrying
  // either are readable without a flag day. Order them most likely first: a
  // card holding a later candidate costs one failed authentication for each
  // candidate ahead of it.
  repeated KeyCandidate candidates = 1;

  // The algorithm this reference uses its key under. It also fixes the key's
  // length: DES 8 bytes; AES-128 and 2K3DES 16; AES-192 and 3K3DES 24;
  // AES-256 32 (encoding/credential.DESFireKeyLength).
  //
  // One key may be named by several references under different algorithms -
  // a privacy application's 2K3DES key reused as a credential application's
  // AES-128 key, say - as long as every reference needs the same length. The
  // device binds the key under the algorithm of the reference using it, not
  // the type it was stored as. A key named at two different lengths, or whose
  // material is not the length its algorithm needs, is rejected when the
  // profile is saved.
  optional KeyAlgorithm algorithm = 2;

  // Absent = the master key is used as-is. Equivalent to a present block with
  // method DIV_NONE; omitting the block is the lighter way to say it.
  KeyDiversification diversification = 3;
}

// One reader-side key that may satisfy this KeyReference. Candidates are
// distinguished only by which key they name; the device tries them in the
// order the KeyReference lists them.
message KeyCandidate
{
  // Which key to use: the 16-byte UID of a key delivered to the device as an
  // encrypted device key. UIDs are device-scoped, so any two profiles may
  // reference the same key, and a key is never addressed by its storage
  // location - the device resolves the UID to wherever it holds the material.
  //
  // MUST be set and MUST name a key the device holds at the version the
  // profile is committed under. A profile naming a key the device does not
  // hold is skipped when profiles are loaded, and the remaining profiles
  // still load. Because a key and the profile that first references it may
  // travel in the same transaction, that check runs once the transaction is
  // committed rather than as each entry arrives.
  //
  // Presence is tracked so an absent reference is rejected rather than read
  // as the all-zero UID.
  optional bytes key_uid = 1;
}

// How the per-card key is derived from the reader-side master key.
message KeyDiversification
{
  // Ordering follows the legacy DivMethod enum so the two read the same way,
  // with the encryption-based method split into its two key options.
  enum Method
  {
    // No diversification: the master key is used as-is. Same effect as
    // omitting the enclosing KeyDiversification block, which is preferred
    // where the choice exists.
    DIV_NONE = 0;

    // AN10922 CMAC diversification. The per-key-type constant (0x01 for
    // AES-128, 0x21/0x22 for 2TDEA, 0x31-0x33 for 3TDEA) is derived from
    // KeyAlgorithm, never configured. Not defined by AN10922 for
    // KeyAlgorithm DES.
    DIV_CMAC = 1;

    // Legacy pre-AN10922 encryption-based diversification, for EV1-era DES and
    // 2K3DES populations: the key is CBC-encrypted with itself, IV = the
    // diversification input. Both halves of the key are diversified.
    DIV_ENCR_FULL = 2;

    // As DIV_ENCR_FULL, but only the first half of the key is diversified and
    // the second half is preserved. 2K3DES populations only - the distinction
    // has no meaning for AES.
    DIV_ENCR_HALF = 3;
  }

  // Must be set explicitly whenever this block is present. DIV_NONE is the
  // zero value, so an unset method reads as "no diversification" and turns an
  // otherwise fully specified block into a silent no-op - which presents in
  // the field as a wrong key rather than as a misconfiguration. An unset
  // method is rejected rather than defaulted.
  optional Method method = 1;

  // Diversification input M: components concatenated in order.
  // Total length must not exceed the AN10922 ceiling for the key type -
  // 31 bytes for AES-128, 15 bytes for 2TDEA/3TDEA. Must be non-empty.
  repeated DiversificationComponent input = 2;
}

// One ordered component of the diversification input M.
message DiversificationComponent
{
  oneof source
  {
    // Runtime bytes: UIDs, FCI slices, the current AID.
    DataReference data = 1;
    // Static bytes: system / site identifier, or an AID whose byte order in M
    // differs from the order used to select the application (issuers disagree;
    // STid ships an "AID reversed" toggle for exactly this).
    bytes literal = 2;
  }
}

// A declarative DESFire transaction: an ordered list of applications to visit,
// what to extract, and how to finish. The device executes a bounded,
// straight-line program - no loops, no branches.
message CredentialProfile
{
  // Authoring identifier. Carried in logs and audits, and on the shadow-state
  // delivery path it is the profile's primary id: the entry is stored and
  // addressed by it, so two profiles on one device never share an id, and
  // editing a profile in place keeps its id while renaming one removes the
  // old entry and adds a new one. At most 63 characters.
  optional string id = 1;

  // Visited strictly in list order. A failed application fails the profile and
  // the device moves on to the next profile in the set. An application listed
  // twice is visited twice - legal, and required by AN10957-style cards whose
  // general mutual authentication key and credential key live in the same
  // application.
  //
  // Which profile the device tries first on a tap is not configurable: a wrong
  // hint would silently skip a profile, presenting in the field as a broken
  // card population.
  repeated DesfireApplication applications = 2;

  // The extracted credential identifier - the value matched against the
  // device's enrolled credentials. Slices are concatenated in list order and
  // the combined length MUST NOT exceed 32 bytes.
  repeated DataReference credential = 3;

  // Additional non-credential data extracted from the same transaction, keyed
  // by consumer name - e.g. an offline access-rights file, an expiry field,
  // audit enrichment. A profile only locates the bytes; how they are
  // interpreted is fixed by the named consumer. Names the device does not
  // recognize are ignored.
  repeated NamedOutput outputs = 4;

  // Optional proof that the data just read was written by the issuer and
  // belongs to this particular card, rather than being a copy lifted onto
  // another one.
  //
  // Some card layouts store a short signature alongside the credential,
  // computed by the issuer over the rest of the object with a key the card
  // itself never holds. Setting this tells the device to recompute that
  // signature and compare, which detects both an altered data object and a
  // valid object cloned to a different card. Verification is entirely local -
  // the key lives on the device, so no online check is involved.
  //
  // Absent = no such check, which is correct for layouts that carry no
  // signature.
  OriginalityCheck originality = 6;

  // How the transaction is closed once the credential has been read and
  // validated.
  //
  // Most access-control cards are read-only, and nothing needs to be sent -
  // the device simply stops talking to the card. Some populations instead
  // expect an explicit end to the exchange, either because the card counts
  // completed transactions or because the applet only treats a read as final
  // once it is acknowledged. Which one a card expects is a property of how it
  // was personalized, so the profile states it.
  //
  // Absent = nothing is sent, the same as NONE.
  TransactionFinalization finalization = 5;
}

// Verification that a data object read from the card is genuine and belongs to
// that card. Evaluated after the reads, before the credential is matched and
// before the transaction is finalized; a failed check fails the profile the
// same way a failed authentication does.
//
// Absent = no such check, which is the case for card populations whose data
// objects carry no signature.
message OriginalityCheck
{
  enum Method
  {
    ORIGINALITY_METHOD_UNSPECIFIED = 0;
    // AN10957 section 5. An eight-byte truncation of a CMAC over the signed
    // bytes, keyed by a UID-diversified key that is never stored on the card,
    // with the CMAC initial vector set to the card UID rather than to zero.
    // Binding to the UID twice - once through the key, once through the
    // initial vector - is what makes it an originality check: a valid data
    // object copied onto a different card no longer verifies.
    SIG_AN10957 = 1;
  }

  optional Method method = 1;

  // The bytes the signature covers, concatenated in list order. For an AN10957
  // PACS data object that is the whole object except the signature itself.
  repeated DataReference signed_data = 2;

  // Where the stored signature is read from.
  DataReference signature = 3;

  // The key the signature is verified with - AN10957 names it the Originality
  // and Cloning Protection System Key. It is diversified like any other key,
  // but the card never holds it, so verification is performed entirely on the
  // device and needs no online check.
  KeyReference key = 4;
}

// Located bytes handed to a named consumer on the device.
message NamedOutput
{
  // Consumer name, e.g. "leaf-privileges", "expiry".
  optional string name = 1;

  // Located the same way as credential slices.
  DataReference data = 2;
}

// One application on the card and everything done inside it: how it is
// selected, how it is authenticated, and what is read from it. The unit of
// execution.
message DesfireApplication
{
  // Authoring breadcrumb, e.g. "leaf-cc-v3", "wavelynx-privacy". Records
  // provenance for logs and debugging; the device does not interpret it.
  optional string name = 1;

  // How this application is identified on the card, and therefore what the
  // device uses to select it - step 1 of the transaction described in
  // "DESFire Credential Definition". A DESFire application can be addressed
  // two ways, and an issuer may personalize a card for either, so the profile
  // states which one this card population expects. Exactly one MUST be set
  // for a DESFire application.
  oneof selection
  {
    // Static 3-byte DESFire application identifier, used with
    // SelectApplication.
    bytes application_id = 2;
    // ISO dedicated-file name, up to 16 bytes, used with ISO SelectFile.
    bytes dedicated_file_name = 3;
    // Application identifier read from an earlier application's output rather
    // than stated here, for cards carrying a directory that maps a facility
    // code to the application holding its data (e.g. Gallagher's Card
    // Application Directory). MUST reference a register written by a
    // preceding application and MUST yield exactly 3 bytes. Because the value
    // comes from the card, it is checked as the transaction runs rather than
    // when the configuration is applied.
    DataReference application_id_from_data = 4;
  }

  // Absent = no authentication in this application (files with FREE read
  // access rights are legitimate for non-sensitive fields).
  Authentication authentication = 5;

  repeated Operation operations = 6;
}

// Mutual authentication inside the enclosing application.
message Authentication
{
  // How the device authenticates to the application.
  //
  // These are DESFire's own authentication commands, each named with the
  // command code it maps to so a value can be matched against the MIFARE
  // DESFire data sheets. Which one a card expects was fixed at personalization
  // by the key type it was given, so this is a property of the card population
  // rather than a reader preference.
  //
  // The set is complete for commands that BEGIN an authentication, which is
  // all a profile ever issues. DESFire also defines AuthenticateEV2NonFirst
  // (0x77), for authenticating again inside an already-established session,
  // and it has no value here: a profile re-selects the application before each
  // authentication, and selecting an application resets the session, so a
  // non-first authentication never arises.
  //
  // AUTH_EV2_FIRST, AUTH_AES and AUTH_ISO are executable today.
  // AUTH_LRP_FIRST and AUTH_NATIVE name commands whose device support has not
  // shipped, on the same terms as KeyAlgorithm - declared so the populations
  // needing them can be described, and rejected at authoring until they work.
  enum Command
  {
    AUTH_COMMAND_UNSPECIFIED = 0;
    // AuthenticateEV2First (0x71). AES secure messaging.
    AUTH_EV2_FIRST = 1;
    // AuthenticateAES (0xAA).
    AUTH_AES = 2;
    // AuthenticateISO (0x1A). Legacy DES / TDEA.
    AUTH_ISO = 3;
    // LRP secure messaging (AN12304). Cards can be irreversibly switched to
    // LRP; reserved so such cards are expressible before device support lands.
    AUTH_LRP_FIRST = 4;
    // Authenticate (0x0A), the original D40 native authentication, for DES and
    // 2K3DES keys on EV1-era populations. Pairs with the DES_CBC and
    // TDEA_2K_CBC key algorithms and with encryption-based diversification.
    AUTH_NATIVE = 5;
  }

  optional Command command = 1;

  // Key number within the application (0x00-0x0D). Key 0 is the application
  // master key; credential read keys are conventionally 1 or above.
  optional uint32 key_number_on_card = 2;

  KeyReference key = 3;
}

// A single card command executed inside the enclosing application.
message Operation
{
  oneof operation
  {
    GetCardUid get_card_uid = 1;
    ReadFile read_file = 2;
  }
}

// GetCardUID (0x51): retrieves the real UID; requires a prior authentication
// in the application. Writes the CARD_UID register. Parameterless by design -
// the session it runs in (application, key) comes from the enclosing
// DesfireApplication.
//
// Use it when the anticollision UID cannot serve as diversification input:
// wallet devices and Random-ID cards randomize their NFCID1 every session,
// so the stable, real UID is only available over an authenticated channel.
// The typical shape is a privacy application whose shared, non-diversified key
// exists solely to unlock this operation, with the credential key then
// diversified over the result. Fixed-UID populations skip it entirely and
// diversify on ANTICOLLISION_UID.
message GetCardUid
{
}

// ReadData (0xBD/0xAD): writes the READ_DATA register.
message ReadFile
{
  // Per-file communication mode, stamped on the card at personalization. The
  // card enforces its file's mode and a reader speaking the wrong one fails,
  // so this is a card-population fact, not a reader preference.
  enum CommunicationMode
  {
    // Encrypted under the session key: confidential and integral.
    ENCIPHERED = 0;
    // Clear data plus a CMAC under the session key: tamper-evident, not
    // confidential.
    MACED = 1;
    // Data in the clear on RF. Legitimate for genuinely public data and for
    // files with FREE read access rights.
    PLAIN = 2;
  }

  // DESFire file number (0x00-0x1F).
  optional uint32 file_number = 1;

  // Byte offset within the file to start reading.
  optional uint32 offset = 2;

  // 0 means the whole file.
  optional uint32 length = 3;

  // Always explicit; never inferred from the card's file settings.
  optional CommunicationMode communication_mode = 4;
}

// How to close the transaction after a successful read.
message TransactionFinalization
{
  enum Type
  {
    // Read-only (e.g. LEAF, generic AN10922 PACS).
    NONE = 0;
    // Commit Transaction 0x90 0xC7.
    COMMIT_TRANSACTION = 1;
    // Complete Transaction 0x90 0xEE.
    COMPLETE_TRANSACTION = 2;
  }

  // The device always validates the extracted credential before finalizing.
  // That ordering is fixed and not configurable.
  optional Type type = 1;
}
