syntax = "proto3";

// Org service definitions for device management, audits, and assignments.
package org;


import "audit.proto";
import "acal.proto";
import "credential.proto";
import "device_modes.proto";
import "dfu.proto";
import "semver.proto";
import "keys.proto";
import "statistics_level.proto";
import "lockmodes.proto";
import "credential_profile.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/descriptor.proto";

// ListDevicesRequest filters device summaries by creation time or IDs.
message ListDevicesRequest
{
  // Unix seconds; include devices created at or after this time.
  optional int64 created_at_or_after = 1;
  // Exact device IDs to include. Empty means no ID filter.
  repeated uint32 device_ids = 2;
}

// StreamDeviceUpdatesRequest filters device update streams by timestamp.
message StreamDeviceUpdatesRequest
{
  // Unix seconds; include updates at or after this time.
  // The stream first sends any persisted updates matching this bound,
  // then continues with live updates.
  optional int64 updated_at_or_after = 1;
}

enum VersionSource
{
  VERSION_SOURCE_UNKNOWN = 0;
  VERSION_SOURCE_ASSUMED = 1;
  VERSION_SOURCE_REPORTED = 2;
}

// DeviceSummary is a lightweight view of a device.
message DeviceSummary
{
  // 4 byte access ID
  optional uint32 device_id = 1;

  // Description of the device
  optional string desc = 2;

  // Time created
  optional int64 time_created = 3;

  // Assignments currently
  optional Credentials credentials = 4;

  // Device's PKOC public key
  optional bytes pkoc_public_key = 5;

  // Device's Ephemeral public key
  optional bytes device_ephemeral_key = 6;

  // Device's Configuration
  //
  // The device's single, unscheduled configuration. A device whose configs are
  // scheduled uses config_set instead, which keeps each scheduled entry
  // distinct.
  optional Configuration configuration = 7;

  // Firmware Version
  optional lastlock.api.semver.SemVer semver = 8;

  // Last seen timestamp
  optional int64 last_seen = 9;

  // Last pending operation
  optional int64 last_operation = 10;

  // Friendly device name shown in client UIs.
  optional string friendly_name = 11;

  // Last credential profile snapshot sent for this device.
  optional lastlock.api.DesfireProfileSet credential_profiles = 12;

  // Device Aliro reader public key captured during provisioning.
  optional bytes aliro_reader_public_key = 13;
  // Device Aliro reader certificate signing request captured during provisioning.
  optional bytes aliro_reader_csr = 16;

  // Device Aliro reader group ID set via SetAliroConfig.
  optional bytes aliro_reader_group_id = 14;

  // Whether semver is an assumed factory value or a device-reported value.
  optional VersionSource version_source = 15;

  // The device's configuration set: configurations applied in list order.
  //
  // Stored as authored rather than merged down into configuration (7).
  // Collapsing a set into one Configuration cannot represent more than one
  // schedule - proto merge keeps only the last - so scheduled configurations
  // have to stay distinct all the way to the device.
  optional ConfigSet config_set = 17;

  // ConfigurationReceipts that are still pending
  repeated ConfigurationReceipt configuration_receipts = 18;
}

// DeviceSummaries is a batch of device summaries.
message DeviceSummaries
{
  // Device summaries in no guaranteed order.
  repeated DeviceSummary device_summaries = 1;
}

// ListAuditsRequest filters audits by server time or device IDs.
message ListAuditsRequest
{
  // Inclusive lower bound for server timestamp (device epoch seconds).
  optional uint32 server_time_after = 1;
  // Exclusive upper bound for server timestamp (device epoch seconds).
  optional uint32 server_time_before = 2;
  // Limit audits to these device IDs. Empty means all devices.
  repeated uint32 device_ids = 3;
}

// Audits is a batch of received audits.
message Audits
{
  // Audits in no guaranteed order.
  repeated lastlock.api.ReceivedAudit audits = 1;
}

// Credentials wraps a list of credential records.
message Credentials
{
  // Credentials assigned to a device or set.
  repeated lastlock.api.Credential credentials = 1;
}

// Sets is a named list of assignment set IDs.
message Sets
{
  // Set names to apply.
  repeated string sets = 1;
}

// AssignmentsRequest defines how credentials are assigned to devices.
message AssignmentsRequest
{
  // Direct credential assignments keyed by device ID.
  // Each device ID maps to the exact set of credentials it should receive.
  map<uint32, Credentials> assignments = 1;

  // Named credential sets that can be reused across multiple devices.
  // Each string key identifies a predefined set of credentials.
  map<string, Credentials> assignment_sets = 2;

  // Device-to-set mappings keyed by device ID.
  // Each device receives the union of:
  //   1) the credentials from all referenced assignment sets, and
  //   2) any direct credentials defined in `assignments`.
  //
  // Duplicate credentials are rejected within a single set definition and within
  // a single direct device assignment. Duplicate credentials across combined
  // sources (set + set, or set + direct) are merged per Link's schedule/bounds
  // merge behavior. If duplicates cannot be merged, the request is rejected.
  map<uint32, Sets> device_set_assignments = 3;
}

// OrganizationKeys contains org-level cryptographic material.
message OrganizationKeys
{
  // PKOC private key material (redacted in logs).
  optional bytes pkoc_key = 1 [debug_redact = true];
}

message DesfireConfigForDevice
{
  optional lastlock.api.CredentialProfile profile = 1;
  map<string, bytes> key_ids = 2 [debug_redact = true];
}

// Configuration stores per-device settings pushed from the org.
message Configuration
{
  message ExperimentalFields
  {
    // Experimental securing mode selection.
    optional lastlock.api.SecuringMode securing_modes = 1;
  }

  // ID for this configuration (utf-8 required)
  optional string id = 18;

  // IANA time zone identifier
  optional string time_zone = 1;

  // Set statistics level
  optional lastlock.api.StatisticsLevel statistics_level = 2;

  // Friendly device name shown in client UIs.
  // Maximum length: 128 characters.
  optional string friendly_name = 3;

  // Aliro configuration
  optional AliroConfigForDevice aliro_configuration = 4;

  // Site use for authentication
  // If missing or empty string, defaults to "default"
  optional string site = 5;

  // Schedules that control when this configuration is active. The
  // configuration is active when ANY of them matches - they are a union, not
  // an intersection.
  //
  // Repeated because one ACalSchedule expresses a single window: one time of
  // day, one duration, one day mask. "Weekdays 09:00-17:00 and Saturday
  // 10:00-14:00" is two windows and cannot be said with one.
  repeated lastlock.api.aliro.ACalSchedule schedule = 7;

  // Persistent device mode selections and mode-related settings.
  optional lastlock.api.DeviceModes modes = 8;

  // Three-byte Terminal Capability Information used to derive/send ECP.
  optional bytes tci = 9;

  // Whether the device is forbidden from entering hibernate. Defaults to
  // false, i.e. hibernate is available unless explicitly disabled.
  optional bool hibernate_disabled = 10;

  // Credentials granted access while this configuration is active.
  //
  // These share the configuration's schedule rather than carrying their own:
  // a scheduled configuration and the credentials valid during it are one
  // statement, and expressing the window twice invites the two disagreeing.
  // A credential here carrying its own schedule is rejected. Its start_time
  // and end_time still apply - those bound the credential's lifetime, not
  // which hours it opens the door.
  //
  // Requires 2.6 firmware, like the rest of the scheduled-configuration path.
  repeated lastlock.api.Credential credentials = 11;

  // MIFARE Classic configurations for this configuration: credential key
  // material plus which key/sector/block/offset/length to read. Repeated,
  // each with its own label - a device can hold several MIFARE Classic
  // configurations at once (see devicestate.proto's MifareClassicDeviceConfig).
  repeated MifareClassicConfigForDevice mifare_classic_configurations = 12;

  // PKOC private key and reader metadata for this device. Singular, unlike
  // mifare_classic_configurations: a device only ever has one PKOC key at a
  // time, so there is no label/collection to disambiguate between several.
  optional PKOCConfigForDevice pkoc_configuration = 13;

  // disable the nfc antenna -- configurations may still be sent to the device
  optional bool disable_nfc = 14;

  // disable the rfid antenna
  optional bool disable_rfid = 15;

  // Non-settable version
  optional int64 version = 16;

  //
  optional DesfireConfigForDevice desfire_config_for_device = 17;

  // Whether this configuration is best-effort with respect to firmware support.
  //
  // When true, a device whose firmware cannot represent this configuration
  // skips it and the write succeeds. When false or unset, the same situation
  // fails the write, so a configuration is never silently not applied.
  optional bool if_supported = 19;

  // Experimental configuration fields. Individual fields may require Link
  // feature flags before they are accepted.
  optional ExperimentalFields experimental_fields = 20;
}

// MIFARE Classic configuration for a device.
//
// mifare_classic_keys is plaintext here, matching how the legacy
// Org.SendDeviceKeys RPC already takes it - the server is what
// ECIES-encrypts it per device before it's sent anywhere. Requires 2.6+
// firmware for the key specifically (delivered via the shadow-state
// Encrypted Key Upsert mechanism, config.CalculateState); devices below 2.6
// still receive the key only via Org.SendDeviceKeys.
message MifareClassicConfigForDevice
{
  // Identifies this configuration among its siblings within the same
  // Configuration entry:
  // config.CalculateState derives this config's device-side uid (and its
  // key's uid) from the surrounding entry's own name plus label, so label
  // only needs to be unique there, not globally - two different Configuration
  // entries may reuse the same label
  // without colliding. An omitted label falls back to this config's
  // position among its siblings.
  optional string label = 7;
  optional lastlock.api.keys.MifareClassicKeys mifare_classic_keys = 1;
  // Which key to authenticate with, and where on the card to read from.
  optional lastlock.api.keys.MifareClassicKeyType key_type = 2;
  optional uint32 sector = 3;
  optional uint32 block = 4;
  optional uint32 offset = 5;
  optional uint32 length = 6;
}

// PKOC (Public Key Occupancy Credential) configuration for a device.
//
// pkoc_keys is plaintext here, matching how the legacy Org.SendDeviceKeys /
// Org.SetOrgKeys RPCs already take it - the server is what ECIES-encrypts
// it per device before it's sent anywhere. Requires 2.6+ firmware for the
// key specifically (delivered via the shadow-state Encrypted Key Upsert
// mechanism, config.CalculateState, always to firmware's fixed
// CONFIG_PSA_KEY_ID_PKOC_PRIV slot - see DeviceKeyType_DEVICE_KEY_TYPE_PKOC_P256);
// devices below 2.6 still receive the key only via Org.SendDeviceKeys /
// Org.SetOrgKeys.
message PKOCConfigForDevice
{
  optional lastlock.api.keys.PKOCKeys pkoc_keys = 1;
  // Reader metadata appended to signed PKOC messages - see PKOC_set_info.
  optional uint32 protocol_version = 2;
  optional uint32 reader_location_identifier = 3;
  optional uint32 site_identifier = 4;
  optional bool time_sync_allowed = 5;
}

// ConfigSet is a group of configurations.
message ConfigSet
{
  reserved 1, 3;

  // Configuration entries in this set. Multiple entries allow scheduled
  // configurations to remain distinct for firmware support. Entries are applied
  // in list order.
  repeated Configuration configurations = 2;

}

// Configurations applies configurations by device ID.
message Configurations
{
  reserved 2, 4;

  message DeleteConfigSetMember
  {
    optional uint32 device_id = 1;
    optional string configuration_id = 2;
  }

  // Map of device_id -> configuration values.
  // Entries are applied to the saved device configuration using protobuf merge
  // semantics.
  map<uint32, Configuration> configurations = 1;

  // Mask of top-level Configuration fields to update dynamically for every
  // entry in configurations and every configuration entry in config_sets. Paths
  // are relative to Configuration. When present, fields named in the mask but
  // omitted from an updated Configuration are cleared.
  optional google.protobuf.FieldMask field_mask = 3;

  // New multi-configuration path keyed by device ID. Within each ConfigSet,
  // entries merge or upsert by Configuration.id. The legacy configurations map
  // remains the simple/base per-device configuration path.
  map<uint32, ConfigSet> config_sets = 5;

  // Config set members to remove from their device's saved config set by
  // Configuration.id.
  repeated DeleteConfigSetMember delete_config_set_members = 6;
}

// DeviceUpdate represents a change in a device summary.
message DeviceUpdate
{
  // Device ID for this update.
  optional uint32 device_id = 1;

  // if missing, we indicate a deletion
  // Summary payload for upsert; omitted means deletion.
  optional DeviceSummary summary = 2;

  // Unix seconds when the update was generated.
  optional int64 timestamp = 3;

  // True when this update corresponds to a hard reset event.
  optional bool hard_reset = 4;

  // Device update version
  optional int64 version = 5;
}

// SetDeviceModeRequest applies lock modes to a device.
message SetDeviceModeRequest
{
  // Device ID to apply modes to.
  optional uint32 device_id = 1;
  // Modes to apply.
  // Current public behavior supports install mode transitions:
  // - ENTER: requires duration_seconds in [300, 7200] (defaults to 300)
  // - EXIT: clears install mode (reboot=true)
  // Also supports hibernate mode transitions:
  // - ENTER: puts the device into hibernate
  // - EXIT: wakes the device from hibernate
  optional lastlock.api.LockModes modes = 2;
}

// AssignmentsResponse reports assignment timing and updated devices.
message AssignmentsResponse
{
  // Server timestamp when assignments were sent.
  optional google.protobuf.Timestamp when_sent = 1;
  // Device IDs updated by this call.
  repeated uint32 updated_devices = 2;
}

// SendDevicesKeysRequest provisions device keys.
message SendDevicesKeysRequest
{
  // Target device IDs.
  repeated uint32 device_ids = 1;
  // Key payloads to provision on each target device.
  // The same key set is applied to every listed device ID.
  repeated lastlock.api.keys.KeyProvisionRequest keys = 2;
}

// HardResetDevicesRequest hard-resets devices by ID.
message HardResetDevicesRequest
{
  // Device IDs to hard reset.
  // Request fails with NotFound if any listed device does not exist.
  repeated uint32 device_ids = 1;
}

// Link-side input shape for one DESFire profile update.
message DesfireProfileInput
{
  // Generic DESFire transaction settings.
  optional lastlock.api.DesfireProfileConfigurations configurations = 1 [debug_redact = true];
  // Deprecated: author keys in DesfireProfileInputSet.key_table instead, so a
  // key shared by several profiles is stored and delivered once. Retained for
  // profiles authored against the per-profile two-role shape.
  optional lastlock.api.keys.GenericDesfire keys = 2 [debug_redact = true];
}

// Link-side input shape for a full DESFire profile update set.
message DesfireProfileInputSet
{
  repeated DesfireProfileInput profiles = 1;
  optional bytes ecp = 2;

  // Cleartext keys for every profile in this set, addressed by key_id. Link
  // serializes this and produces a single ECIES envelope per target device
  // (Configurations.encrypted_keys), one envelope per key.
  optional lastlock.api.keys.KeyTable key_table = 3 [debug_redact = true];
}

// UpdateCredentialProfilesRequest sets card credential profiles for this org.
message UpdateCredentialProfilesRequest
{
  // Target devices to receive this profile update.
  repeated uint32 device_ids = 1;
  // Complete profile snapshot to fan out to target devices.
  optional DesfireProfileInputSet profile_set = 2;
}

// Per-device result for an UpdateCredentialProfiles fanout.
message UpdateCredentialProfilesDeviceResult
{
  // Target device ID.
  optional uint32 device_id = 1;
  // Human-readable failure detail. Empty for successful devices.
  optional string message = 2;
}

// UpdateCredentialProfilesResponse reports per-device fanout success and failure.
message UpdateCredentialProfilesResponse
{
  // Devices that accepted the profile update.
  repeated UpdateCredentialProfilesDeviceResult devices_successful = 1;
  // Devices that failed to accept the profile update.
  repeated UpdateCredentialProfilesDeviceResult devices_failed = 2;
}

// AliroConfigForDevice sets Aliro reader configuration for one device.
message AliroConfigForDevice
{
  // Target device ID.
  optional uint32 device_id = 1;
  // 16-byte reader group ID.
  optional bytes reader_group_id = 2;
  // DER X.509 reader certificate.
  optional bytes reader_certificate = 3;
  // P-256 public keys (limit: 1), each 65-byte uncompressed SEC1 encoding: 0x04 || X || Y.
  repeated bytes issuer_public_keys = 4;
  // DER X.509 Credential Issuer CA certificates trusted for Access Document x5chain verification.
  repeated bytes credential_issuer_ca = 5;
  // Access document element ids
  repeated bytes access_document_element_ids = 6;
  // P-256 Reader System Issuer CA public key (65-byte uncompressed SEC1: 0x04 || X || Y)
  // used by the device to validate the reader certificate.
  optional bytes reader_system_issuer_ca_pub_key = 7;
}

// SetAliroConfigRequest sets Aliro reader configuration for one or more devices.
message SetAliroConfigRequest
{
  // Per-device Aliro configuration entries.
  repeated AliroConfigForDevice configs = 1;
}

// SetAliroConfigResponse is intentionally empty.
message SetAliroConfigResponse
{
}

// Aliro access data element identifier request payload.
message AliroAccessElementIdentifiers
{
  // Access Data Element identifiers to request from the user device.
  repeated string data_element_identifiers = 1;
}

// Feature identifies a device capability that may be required by a server-side
// configuration. When a configuration contains a feature that is newer than the
// target device firmware, Link rejects the write before sending an unsupported
// payload to the device.
enum Feature
{
  // Unknown means the server detected that the configuration would lose data
  // when converted to the target firmware schema, but could not map the loss to
  // a more specific feature.
  Unknown = 0x00;
  // Aliro reader configuration.
  Aliro = 0x01;
  // Device credential profile configuration.
  CredentialProfiles = 0x02;
  // Configurations and credentials delivered as Shadow State entries, which
  // is what carries per-configuration schedules. Requires 2.6 firmware.
  ScheduledConfigurations = 0x03;
}

// UnsupportedConfigurationDevice describes one device that cannot accept a
// requested configuration because its current firmware does not support one or
// more features present in that configuration.
message UnsupportedConfigurationDevice
{
  // Device ID for the device that cannot accept the configuration. This may be
  // absent when the unsupported feature is detected before the failing device is
  // known.
  optional uint32 deviceID = 1;
  // Features that require a newer device firmware version.
  repeated Feature features = 2;
}

// UnsupportedConfiguration is returned in the details of a gRPC Unimplemented
// error when Link refuses to send a configuration update that would be partially
// unsupported by one or more target devices.
message UnsupportedConfiguration
{
  // Per-device unsupported configuration details.
  repeated UnsupportedConfigurationDevice devices = 1;
}

// SetAliroAccessElementIdentifiersRequest sends Aliro access element identifier requests by device
// ID.
message SetAliroAccessElementIdentifiersRequest
{
  // Map of device_id -> Aliro Access Data Element identifier request.
  map<uint32, AliroAccessElementIdentifiers> requests = 1;
}

message ConfigurationReceipt
{
  optional uint32 device_id = 1;
  optional string receipt_id = 2;
  optional string set_id = 3;
}

message ConfigurationConfirmations
{
  optional string set_id = 1;
  repeated ConfigurationReceipt receipts = 2;
}

// Org exposes public, org-scoped device management APIs.
service Org
{
  // List device summaries, optionally filtered by creation time or explicit IDs.
  rpc ListDeviceSummaries(ListDevicesRequest) returns (DeviceSummaries);

  // Stream device summaries as a series of batch updates.
  rpc StreamDeviceSummaries(ListDevicesRequest) returns (stream DeviceSummaries);

  // Stream device updates as incremental changes (upserts or deletions).
  // If DeviceUpdate.summary is absent, treat the update as a deletion event.
  rpc StreamDeviceUpdates(StreamDeviceUpdatesRequest) returns (stream DeviceUpdate);

  // List audits, optionally filtered by server time and device IDs.
  rpc ListAudits(ListAuditsRequest) returns (Audits);

  // Stream audits in real time as they are received.
  rpc StreamAudits(ListAuditsRequest) returns (stream lastlock.api.ReceivedAudit);

  // Assign credentials and sets to devices in bulk.
  // Maximum 10,000 credentials may be applied to a given device.
  // Status code exhausted is returned if 10,000 credentials is exceeded.
  rpc Assign(AssignmentsRequest) returns (AssignmentsResponse);

  // Set keys for the organization.
  // Deprecated; prefer SendDeviceKeys.
  // This method sets org-level PKOC key material.
  rpc SetOrgKeys(OrganizationKeys) returns (google.protobuf.Empty)
  {
    // TODO(SW-9460): remove once all orgs are migrated off Link client v1.
    option deprecated = true;
  }

  // Set per-device configuration overrides by device ID.
  // Applies partial updates; unspecified fields remain unchanged.
  rpc SetConfiguration(Configurations) returns (ConfigurationConfirmations);

  // Apply lock mode changes to a single device.
  // Current behavior supports install mode enter/exit.
  rpc SendLockMode(SetDeviceModeRequest) returns (google.protobuf.Empty);

  // Provision key material for one or more devices.
  // The request key set is applied to each listed device.
  rpc SendDeviceKeys(SendDevicesKeysRequest) returns (google.protobuf.Empty);

  // Hard reset one or more devices.
  // Returns NotFound if any requested device is missing.
  rpc HardResetDevices(HardResetDevicesRequest) returns (google.protobuf.Empty);

  // Set Aliro provisioning inputs for one or more devices.
  rpc SetAliroConfig(SetAliroConfigRequest) returns (SetAliroConfigResponse);

  // Send the latest card credential profile set to devices in the org.
  rpc UpdateCredentialProfiles(UpdateCredentialProfilesRequest)
      returns (UpdateCredentialProfilesResponse);

  // Send Aliro access element identifier requests to one or more devices.
  rpc SetAliroAccessElementIdentifiers(SetAliroAccessElementIdentifiersRequest)
      returns (google.protobuf.Empty);

  // List the reachable DFU graph starting from the supplied versions.
  rpc ListAvailableDFUs(link.ListAvailableDFUsRequest) returns (link.DFUGraph);

  // Target the next DFU hop for one or more devices based on their current versions.
  rpc TargetDFUs(link.TargetDFUsRequest) returns (link.TargetDFUsResponse);
}
